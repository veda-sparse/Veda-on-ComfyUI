name: Publish to Comfy Registry

# Publishes when the version in pyproject.toml changes on main (see
# AGENTS.md "Release"). Needs the repository secret REGISTRY_ACCESS_TOKEN
# (an API key of the publisher in [tool.comfy] PublisherId).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'veda-sparse' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
