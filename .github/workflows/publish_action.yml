name: Publish to Comfy Registry

# Publishes when the version in pyproject.toml changes on main (see
# AGENTS.md "Release"). Needs the repository secret REGISTRY_ACCESS_TOKEN
# (an API key of the publisher in [tool.comfy] PublisherId).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  # contents: read is required: declaring any permissions block resets
  # every scope not listed to none, and without it actions/checkout
  # cannot read this repository ("remote: Repository not found").
  contents: read
  issues: write

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'veda-sparse' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # to diff the version against the parent commit
      - name: Check whether the version changed
        id: check
        shell: bash
        run: |
          # The push trigger fires on any pyproject.toml edit, so a
          # description or dependency change would otherwise try to
          # republish the version that is already in the registry.
          version() { grep -m1 -E '^version *=' - ; }
          new=$(version < pyproject.toml)
          old=$(git show HEAD~1:pyproject.toml 2>/dev/null | version || true)
          echo "parent: ${old:-<none>}"
          echo "head:   ${new:-<none>}"
          if [ "${{ github.event_name }}" != "push" ] || [ "$new" != "$old" ]
          then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version unchanged; nothing to publish."
          fi
      - name: Publish Custom Node
        if: steps.check.outputs.changed == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
