name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # CPU unit tests, including the ComfyUI integration tests, on every OS
    # the node ships for. GPU kernels are covered by tests/gpu on real
    # hardware (see docs/features/backends.md).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: comfyanonymous/ComfyUI
          ref: v0.38.2
          path: ComfyUI
      - uses: actions/checkout@v7
        with:
          path: ComfyUI/custom_nodes/Veda-on-ComfyUI
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        shell: bash
        working-directory: ComfyUI
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install torch torchvision
          else
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt pytest ruff
      - name: Lint
        working-directory: ComfyUI/custom_nodes/Veda-on-ComfyUI
        run: ruff check .
      - name: Unit tests
        working-directory: ComfyUI/custom_nodes/Veda-on-ComfyUI
        run: python -m pytest tests/unit -q
